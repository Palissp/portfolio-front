server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    # A location that declares its own add_header inherits none of these, so any
    # location below that needs one has to repeat what it still wants.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Cloud Run terminates TLS and sets no HSTS of its own; browsers ignore this
    # header on the plain-HTTP hop between Cloud Run and this container.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # style-src needs 'unsafe-inline': Angular injects component styles as <style>
    # tags at runtime and the build inlines critical CSS. The script hash is the
    # `onload="this.media='all'"` the critical-CSS step puts on the deferred
    # stylesheet link — an inline handler, which needs 'unsafe-hashes' to match.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    # Angular emits content-hashed filenames, so these are safe to cache forever.
    location ~* \.(?:js|css|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # The only one of the above that means anything on a static asset.
        add_header X-Content-Type-Options "nosniff" always;
    }

    # `expires -1` is `Cache-Control: no-cache`, and unlike add_header it does not
    # shadow the security headers above.
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
